<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — IRANIAMO</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #222;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 25px;
            direction: rtl;
        }

        nav a {
            font-size: 15px;
            color: #555;
        }

        nav a:hover {
            color: #000;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 80px 20px;
        }

        .contact-container {
            max-width: 600px;
        }

        .contact-container h1 {
            font-size: 42px;
            margin: 0 0 30px;
            direction: ltr;
            text-align: left;
        }

        .contact-section {
            margin-bottom: 30px;
            font-size: 18px;
            color: #444;
            direction: ltr;
            text-align: left;
        }

        .contact-section label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .contact-section p, .contact-section a {
            margin: 0;
            display: block;
        }

        .contact-section a:hover {
            color: #000;
            text-decoration: underline;
        }

        footer {
            border-top: 1px solid #ddd;
            margin-top: 80px;
            padding: 30px 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
            direction: ltr;
        }

        @media (max-width: 800px) {
            .header-inner {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 550px) {
            .contact-container h1 {
                font-size: 32px;
            }

            nav {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">IRANIAMO</a>
        <nav>
            <a href="index.html">خانه</a>
            <a href="issues.html">شماره‌ها</a>
            <a href="artists.html">هنرمندان</a>
            <a href="about.html">درباره</a>
            <a href="contact.html">تماس</a>
        </nav>
    </div>
</header>

<main>
    <div class="contact-container">
        <h1>Contact</h1>

        <div class="contact-section">
            <label>Address</label>
            <p>Unit. 6, No. 6, Dibaj St., Shariati St., Tehran, Iran</p>
        </div>

        <div class="contact-section">
            <label>Telephone</label>
            <p><a href="tel:+982126400980">+98 21 26 400 980 - 2</a></p>
        </div>

        <div class="contact-section">
            <label>Email</label>
            <p><a href="mailto:collaborate@iraniamo.one">collaborate@iraniamo.one</a></p>
            <p><a href="mailto:info@iraniamo.one">info@iraniamo.one</a></p>
        </div>
    </div>
</main>

<footer>
    © 2026 IRANIAMO. All rights reserved.
</footer>

</body>
</html>
